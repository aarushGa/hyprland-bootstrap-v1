# Cache Folder
$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles

# Source colors
source = colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/aarush/Downloads/wallpapers/hyprlock.jpg

    blur_passes = 2
    blur_size = 2

    noise = 0

    contrast = 1.2
    brightness = 0.7

    vibrancy = 0
    vibrancy_darkness = 0
}

input-field {
    monitor =

    size = 230, 55

    dots_size = 0.20
    dots_spacing = 0.75
    dots_center = true
    dots_rounding = -1

    inner_color = rgb(101010)

    # White outline
    outer_color = rgb(ffffff)
    outline_thickness = 2

    dots_color = rgb(e6e6e6)
    font_color = rgb(ffffff)

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <i>tell bruh</i>

    hide_input = false

    rounding = 12

    check_color = rgb(ffffff)
    fail_color = rgb(ff5555)
    fail_text = <i> why not stay away ?</i>

    position = 0, -20
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(000000)
    shadow_boost = 1.2
}

label {
    monitor =

    text = cmd[update:1000] echo "$TIME"

    color = rgb(ffffff)

    font_size = 72
    font_family = Fira Sans Semibold

    position = -50, 20

    halign = right
    valign = bottom

    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgb(000000)
}

label {
    monitor =

    text = aarush

    color = rgb(cfcfcf)

    font_size = 20
    font_family = Fira Sans Semibold

    position = -50, 120

    halign = right
    valign = bottom

    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgb(000000)
}

image {
    monitor =

    path = /home/aarush/Pictures/hyprlock/luffy.jpg

    size = 280

    rounding = 300

    border_size = 4
    border_color = rgb(ffffff)

    rotate = 0

    reload_time = -1

    position = 0, 200

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(000000)
    shadow_boost = 1.2
}

label {
    monitor =

    text = "never miss a good chance to shutup"

    color = rgba(240, 239, 239, 0.33)

    font_size = 24
    font_family = Darker Grotesque SemiBold

    halign = center
    valign = center

    position = 0, 85
}


label {
    monitor =

    text = - Will Rogers

    color = rgba(240, 239, 239, 0.33)
    
    font_size = 18
    font_family = Darker Grotesque SemiBold
    halign = center
    valign = center

    position = 0, 50
}