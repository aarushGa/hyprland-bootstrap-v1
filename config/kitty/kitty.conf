# vim:ft=kitty

###########################################################
# Monochrome Kitty Theme
###########################################################

foreground            #ffffff
background            #000000

selection_foreground  #000000
selection_background  #ffffff

url_color             #d9d9d9

###########################################################
# ANSI Colors
###########################################################

# Black
color0  #0f0f0f
color8  #4d4d4d

# Red
color1  #7a7a7a
color9  #9a9a9a

# Green
color2  #8c8c8c
color10 #b0b0b0

# Yellow
color3  #a0a0a0
color11 #c8c8c8

# Blue
color4  #b5b5b5
color12 #d6d6d6

# Magenta
color5  #c5c5c5
color13 #e5e5e5

# Cyan
color6  #d5d5d5
color14 #f2f2f2

# White
color7  #e5e5e5
color15 #ffffff

###########################################################
# Cursor
###########################################################

cursor            #ffffff
cursor_text_color #000000

###########################################################
# Window
###########################################################

background_opacity         0.75
background_blur            32
dynamic_background_opacity yes

window_padding_width       15
placement_strategy         center

###########################################################
# Fonts
###########################################################

font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

###########################################################
# Tab Bar
###########################################################

tab_bar_style       powerline
tab_powerline_style slanted

active_tab_background #ffffff
active_tab_foreground #000000

inactive_tab_background #1a1a1a
inactive_tab_foreground #b5b5b5

###########################################################
# Borders
###########################################################

active_border_color   #ffffff
inactive_border_color #3a3a3a

###########################################################
# Mouse / URLs
###########################################################

detect_urls yes
copy_on_select yes
mouse_hide_wait 3.0

###########################################################
# Performance
###########################################################

repaint_delay 10
input_delay 3
sync_to_monitor yes
confirm_os_window_close 0
enable_audio_bell no

###########################################################
# Cursor Trail
###########################################################

cursor_trail 30
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1

cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0